version: 2
updates:
  # Python / uv. El ecosistema `pip` solo tocaba las constraints de pyproject.toml
  # y dejaba uv.lock atrás, así que sus PRs rompían el `uv sync --locked` del CI.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci):"
